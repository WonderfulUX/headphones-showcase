<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./headphone-showcase.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <title>Headphone 3D showcase in 2D space</title>
</head>

<body>
    <a href="https://wonderfulux.com" target="_blank">
        <svg class="redirect-logo" width="787" height="570" viewBox="0 0 787 570" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
                d="M52.6001 42.2222C132.888 42.2222 206.319 87.2057 242.39 158.488L311.244 294.556C341.517 354.38 341.429 424.935 311.016 484.69L267.596 570L0 42.2222H52.6001Z" />
            <path
                d="M320.569 42.2222C400.665 42.2222 473.956 86.9922 510.121 158.014L579.556 294.38C610.063 354.294 610.072 425.058 579.576 484.978L536.301 570L267.596 42.2222H320.569Z" />
            <path class="rotating-star"
                d="M672.309 5.95812C693.704 54.1676 732.469 92.6811 780.984 113.936L787 116.575L781.005 119.204C732.476 140.465 693.701 178.995 672.309 227.223L669.664 233.191L667.019 227.223C645.627 178.995 606.852 140.464 558.323 119.204L552.327 116.575L558.344 113.936C606.859 92.6813 645.623 54.1675 667.019 5.95812L669.664 0L672.309 5.95812Z" />
        </svg>
    </a>
    <h1>Showcase</h1>
    <div class="perspective-container">
        <div class="video-container" data-pos="1">
            <div class="video-item">
                <div class="clockwise"></div>
                <div class="anti-clockwise"></div>
                <div class="expand"></div>
                <video loop autoplay muted src="./sony-hq.mp4"></video>
                <h2>Sony WH-1000XM6</h2>
            </div>
        </div>
        <div class="video-container" data-pos="2">
            <div class="video-item">
                <div class="clockwise"></div>
                <div class="anti-clockwise"></div>
                <div class="expand"></div>
                <video loop autoplay muted src="./beyerdynamic.mp4"></video>
                <h2>Beyerdynamic AVENTHO 300</h2>
            </div>
        </div>
        <div class="video-container" data-pos="3">
            <div class="video-item">
                <div class="clockwise"></div>
                <div class="anti-clockwise"></div>
                <div class="expand"></div>
                <video loop autoplay muted src="./hifiman.mp4"></video>
                <h2>Hifiman Isvarna</h2>
            </div>
        </div>
    </div>

</body>
<script src="./index.js"></script>

</html>
